[package]
name = "zcg"
version = "0.1.0"
description = "ZAYNAB Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zcg"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
proc-macro2 = "1.0.86"
indexmap = "2.2.6"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
